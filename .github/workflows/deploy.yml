name: Deploy to GCP

on:
  push:
    branches:
      - main
      - 'deploy-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/44782254933/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-deploy@weaveforward-system.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push backend image
        run: |
          docker build -t gcr.io/weaveforward-system/weaveforward-backend WeaveForward_Backend
          docker push gcr.io/weaveforward-system/weaveforward-backend

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy weaveforward-backend \
            --image gcr.io/weaveforward-system/weaveforward-backend \
            --region asia-southeast1 \
            --platform managed \
            --project weaveforward-system \
            --update-env-vars "DJANGO_ML_DIR=fiber_match_api/models,RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/44782254933/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-deploy@weaveforward-system.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push frontend image
        run: |
          docker build -t gcr.io/weaveforward-system/weaveforward-frontend WeaveForward_Frontend
          docker push gcr.io/weaveforward-system/weaveforward-frontend

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy weaveforward-frontend \
            --image gcr.io/weaveforward-system/weaveforward-frontend \
            --region asia-southeast1 \
            --platform managed \
            --project weaveforward-system

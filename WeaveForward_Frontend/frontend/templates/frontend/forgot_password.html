{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>WeaveForward - Forgot Password</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&family=Poppins:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --b: #3C6591;
            --bd: #2d5478
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Poppins, sans-serif
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('{% static "frontend/img/role_select_background.jpg" %}') center/cover no-repeat;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 40px 44px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .18);
            position: relative
        }

        .icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--b);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px
        }

        .icon svg {
            fill: #E6DBC7
        }

        .title {
            font-family: 'Pixelify Sans', monospace;
            font-size: 34px;
            font-weight: 500;
            color: var(--b);
            text-align: center;
            margin-bottom: 28px
        }

        .group {
            margin-bottom: 18px
        }

        .lbl-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px
        }

        .lbl {
            font-size: 13px;
            color: #444;
            font-weight: 400
        }

        .in {
            width: 100%;
            border: 0.5px solid #000;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 14px;
            outline: none;
            transition: .15s;
            color: #3C6591
        }

        .in:focus {
            border-color: var(--b)
        }

        .in::placeholder {
            color: #bbb
        }

        .btn {
            width: 100%;
            background: var(--b);
            color: #E6DBC7;
            border-radius: 30px;
            padding: 14px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: .15s;
            margin-top: 10px
        }

        .btn:hover {
            background: var(--bd)
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 13px;
            text-decoration: none
        }

        .back-link:hover {
            text-decoration: underline
        }

        .alert {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert-error {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
        }

        .alert-success {
            background: #dcfce7;
            border: 1px solid #22c55e;
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">
            <svg width="30" height="30" viewBox="0 0 24 24">
                <path
                    d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm-1-11v6h2v-6h-2zm0-4v2h2V7h-2z" />
            </svg>
        </div>
        <div class="title">Forgot Password</div>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <div class="group">
                <div class="lbl-row"><label class="lbl" for="em">Enter your email</label></div>
                <input class="in" type="email" id="em" name="email" placeholder="juan.delacruz@gmail.com" required>
                <p style="font-size: 11px; color: #666; margin-top: 8px;">We'll send you a link to reset your password.
                    If 2FA is enabled, it will be disabled after reset.</p>
            </div>

            <button class="btn" type="submit">Send Reset Link</button>
        </form>
        <a href="{% url 'login' %}" class="back-link">Back to Login</a>
    </div>
</body>

</html>

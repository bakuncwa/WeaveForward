{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="{% static 'frontend/img/ProjectIcon.png' %}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>WeaveForward - Forgot Password</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/Dg9FmRA.png" />
    <link
        href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&family=Poppins:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/css/auth.css' %}">
    <style>
        .btn {
            margin-top: 10px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 13px;
            text-decoration: none
        }

        .back-link:hover {
            text-decoration: underline
        }

        .alert {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert-error {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
        }

        .alert-success {
            background: #dcfce7;
            border: 1px solid #22c55e;
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">
            <svg width="30" height="30" viewBox="0 0 24 24">
                <path
                    d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm-1-11v6h2v-6h-2zm0-4v2h2V7h-2z" />
            </svg>
        </div>
        <div class="title">Forgot Password</div>

        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <div class="group">
                <div class="lbl-row"><label class="lbl" for="em">Enter your email</label></div>
                <input class="in" type="email" id="em" name="email" placeholder="juan.delacruz@gmail.com" required>
                <p style="font-size: 11px; color: #666; margin-top: 8px;">We'll send you a link to reset your password.
                    If 2FA is enabled, it will be disabled after reset.</p>
            </div>

            <button class="btn" type="submit">Send Reset Link</button>
        </form>
        <a href="{% url 'login' %}" class="back-link">Back to Login</a>
    </div>
    <script>
        window.WF_TEXT_FIELD_MAX_LENGTH = {{ TEXT_FIELD_MAX_LENGTH }};
    </script>
    <script src="{% static 'frontend/js/input-length-limit.js' %}"></script>
</body>

</html>

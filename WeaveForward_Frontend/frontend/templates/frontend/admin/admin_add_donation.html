{% extends 'frontend/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Lato:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{% static 'frontend/js/location-picker.js' %}"></script>

  <link rel="stylesheet" href="{% static 'frontend/css/donation-form.css' %}">
  <link rel="stylesheet" href="{% static 'frontend/css/fiber-editor.css' %}">
  <style>
  .btn-add, .btn-submit { width: 100%; padding: 12px; cursor: pointer; font-family: 'Poppins', sans-serif; border: none; font-size: 16px; outline: none; }
  .btn-add { 
    width: 95%; display: block; margin: 0 auto 20px;
    background: var(--gold); color: var(--btn-text); 
    border: 2px dashed var(--dashed-stroke); border-radius: 8px; height: 48px; 
  }
  .btn-submit { background: var(--gold); color: var(--btn-text); border-radius: 30px; margin-top: 14px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15); }
  .trash { background: none; border: none; color: var(--gold); cursor: pointer; }

  .ss-list { position: absolute; z-index: 100; top: 100%; left: 0; width: 100%; max-height: 200px; overflow-y: auto; background: #fff; border: 1.5px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .mat-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f5f5f5; color: #666666; font-family: 'Poppins', sans-serif; }

  #picker-map { width: 100%; height: 350px; }
  .pin { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gold); cursor: pointer; }
  .pin-wrap { position: relative; }
  .pin-wrap .restored-in { padding-right: 42px; }

  .modal { position: fixed; inset: 0; background: transparent; display: flex; align-items: center; justify-content: center; z-index: 999; }
  .modal-box { background: #fff; border-radius: 16px; overflow: hidden; width: min(640px, 95vw); box-shadow: 0 20px 60px rgba(0,0,0,0.22); }
  .map-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px; background: #fff; }
  .map-title { display: flex; align-items: center; gap: 10px; font-size: 20px; color: var(--gold); font-weight: 400; }
  .map-title-text { color: #000; font-family: 'Poppins', sans-serif; font-weight: 400; }
  .map-caption { margin-top: 4px; font-size: 12px; color: #666666; font-family: 'Poppins', sans-serif; font-weight: 400; }
  .map-close { border: none; background: none; color: #333; cursor: pointer; padding: 4px; }
  .map-actions { display: flex; justify-content: center; padding: 20px; background: #fff; }
  .map-confirm { width: min(220px, 100%); margin: 0; font-family: 'Poppins', sans-serif; font-weight: 300; font-size: 14px; }

  .drop { border: 2px dashed #e8a020; border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer; position: relative; }
  .drop-icon { width: 56px; height: 56px; margin: 0 auto 16px; display: block; }
  .img-wrap { position:relative; display:inline-block; max-width:100%; }
  .img-x { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,0.5); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; line-height:1; padding:0; z-index:2; }
  .img-x:hover { background:rgba(0,0,0,0.7); }
</style>

<div class="wf-content-inner">
  <form id="add-frm" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="items" id="items-json">

    <div class="restored-layout">
      <!-- Left: Items -->
      <div class="restored-left">
        <div id="cards">
          <!-- Cards added via JS -->
        </div>
        <button type="button" class="btn-add" onclick="addCard()">+ Add Another Clothing Group</button>
      </div>

      <!-- Right: Global Info -->
      <div class="restored-right">
        <div class="restored-panel">
          <div class="restored-group" style="margin-bottom:18px">
            <label class="sub-title">Donor</label>
            <div class="ss-wrap" style="position:relative">
              <div class="mat-trigger" id="dnr-trigger" onclick="toggleDnrDropdown(this)">
                <span class="mat-text" id="dnr-text">Search donor</span>
                <svg class="mat-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg>
              </div>
              <input type="hidden" name="donor_user_id" id="dnr-id" required>
              <div id="dnr-ac" class="ss-list hidden">
                <input type="text" class="mat-search" id="dnr-search" placeholder="Search donor…" oninput="fetchDonors(this.value)" onclick="event.stopPropagation()" autocomplete="off">
                <div class="mat-items" id="dnr-items"></div>
              </div>
            </div>
          </div>

          <div class="restored-group" style="margin-bottom:18px">
            <label class="sub-title">Preferred Pick-Up Date</label>
            <input class="restored-in restored-in-lg" type="date" name="preferred_pickup_date" required>
          </div>
          <div class="restored-row" style="gap:10px; margin-bottom:18px">
            <div class="restored-group">
              <label class="up-label">From</label>
              <input class="restored-in" type="time" name="preferred_pickup_window_start" required>
            </div>
            <div class="restored-group">
              <label class="up-label">To</label>
              <input class="restored-in" type="time" name="preferred_pickup_window_end" required>
            </div>
          </div>
          <div class="restored-group">
            <label class="sub-title">Pick-Up Location</label>
            <div class="pin-wrap">
              <div class="ss-wrap" style="flex:1; position:relative">
                <div class="mat-trigger" onclick="toggleAddrDropdown(this)">
                  <span class="mat-text" id="addr-text">Address</span>
              <svg class="mat-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg>
                </div>
                <input type="hidden" id="addr" name="pickup_display_address" required>
                <div id="ac" class="ss-list hidden">
                  <input type="text" class="mat-search" id="addr-search" placeholder="Search address..." oninput="srchAddr(this.value)" onclick="event.stopPropagation()" autocomplete="off">
                  <div class="mat-items" id="addr-items"></div>
                </div>
              </div>
              <button type="button" class="pin" onclick="openMap()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </button>
              <input type="hidden" id="lat" name="pickup_latitude">
              <input type="hidden" id="lng" name="pickup_longitude">
            </div>
          </div>
          <button type="submit" class="btn-submit">Submit Donation</button>
        </div>

        <div class="restored-panel">
          <div class="upload-header" style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #000; font-family: 'Inter', sans-serif;">Donation Upload</div>
            <div style="font-size: 14px; color: #666666; font-family: 'Poppins', sans-serif;">Add the image of your donation here</div>
          </div>
          <div class="drop" onclick="document.getElementById('img-in').click()">
            <div id="img-ph">
              <svg class="drop-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M54 18H34.8L28.8 12H10C7.8 12 6.02 13.8 6.02 16L6 48C6 50.2 7.8 52 10 52H54C56.2 52 58 50.2 58 48V22C58 19.8 56.2 18 54 18Z" fill="#FBBF24"/>
                <circle cx="32" cy="36" r="8" fill="white" fill-opacity="0.2"/>
                <path d="M32 30L32 42M32 30L28 34M32 30L36 34" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div id="img-wrap" class="img-wrap" style="display:none">
              <img id="img-prv" src="" style="max-width:100%; border-radius:8px;">
              <button type="button" class="img-x" onclick="event.stopPropagation();clearFileInput()">✕</button>
            </div>
            <input id="img-in" name="donation_image" type="file" accept=".jpg,.jpeg,.png" class="hidden" onchange="previewImg(this)">
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

<template id="card-tpl">
  <div class="restored-card">
    <div class="restored-head">
      <div class="card-title-wrap">
        <div class="card-num"></div>
        <h2 class="card-title"></h2>
      </div>
      <button type="button" class="trash" onclick="this.closest('.restored-card').remove()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m4 5v6m4-6v6M9 6V4h6v2"/></svg>
      </button>
    </div>
    <div class="card-body">
      <div class="restored-row">
        <div class="restored-group">
          <label class="up-label">Clothing*</label>
          <div class="ss-wrap" style="position:relative">
            <input type="text" class="restored-sel type-sel" maxlength="200" required placeholder="Choose or type clothing type" autocomplete="off">
            <svg class="mat-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none"><polyline points="6,9 12,15 18,9"/></svg>
            <div class="ss-list hidden">
              {% for t in clothing_types %}<div class="mat-item">{{ t|title }}</div>{% endfor %}
            </div>
          </div>
        </div>
        <div class="restored-group"><label class="up-label">Estimated Weight (kg)</label><input type="number" step="0.01" min="0.01" max="254" class="restored-in weight-in" required></div>
      </div>
      <div class="restored-group" style="margin-bottom:14px">
        <label class="up-label">Condition</label>
        <select class="restored-sel cond-sel" required>
          {% for val, text in condition_choices %}<option value="{{ val }}">{{ text }}</option>{% endfor %}
        </select>
      </div>
      <div class="restored-row" style="margin-bottom:0">
        <div class="restored-group">
          <label class="up-label">Brand</label>
          <div class="ss-wrap" style="position:relative">
            <input type="text" class="restored-sel brand-sel" maxlength="200" required placeholder="Choose or type brand" autocomplete="off">
            <svg class="mat-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none"><polyline points="6,9 12,15 18,9"/></svg>
            <div class="ss-list hidden">
              {% for b in all_brands %}<div class="mat-item">{{ b }}</div>{% endfor %}
            </div>
          </div>
        </div>
        <div class="restored-group">
          <label class="up-label">Material</label>
          <div class="ss-wrap mat-search-wrap" style="position:relative" data-api-url="{% url "material_search_proxy" %}" data-allow-custom>
            <div class="mat-trigger disabled" onclick="toggleMatDropdown(this)">
              <span class="mat-text">Please enter a brand and clothing type</span>
              <svg class="mat-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg>
            </div>
            <input type="hidden" class="lookup-id">
            <div class="ss-list hidden">
              <input type="text" class="mat-search" placeholder="Search or leave empty" oninput="filterMatList(this)" onclick="event.stopPropagation()" autocomplete="off">
              <div class="mat-item custom-mat-option" onclick="selectCustomComposition(this)">Custom composition...</div>
              <div class="mat-items"></div>
            </div>
            <div class="fiber-editor hidden">
              <div class="fiber-rows"></div>
              <button type="button" class="fiber-add-btn" onclick="addFiberRow(this)">+ Add fiber</button>
              <div class="fiber-total">Total: <span class="fiber-sum">0</span>%</div>
              <input type="hidden" class="fiber-composition" value="">
              <button type="button" class="fiber-cancel" onclick="cancelCustomComposition(this)">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Map Modal -->
<div id="map-modal" class="modal hidden">
  <div class="modal-box">
    <div class="map-head">
      <div class="map-head-left">
        <div class="map-title">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></svg>
          <span class="map-title-text">Pick on Map</span>
        </div>
        <div class="map-caption">Click anywhere or drag the marker to set your pickup location.</div>
      </div>
      <button type="button" class="map-close" onclick="closeMap()" aria-label="Close map">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" /></svg>
      </button>
    </div>
    <div id="picker-map"></div>
    <div class="map-actions">
      <button type="button" class="btn-submit map-confirm" onclick="confirmMap()">Confirm Location</button>
    </div>
  </div>
</div>

<script>
  // --- Auto-Location ---
  navigator.geolocation.getCurrentPosition(async({coords:{latitude:t,longitude:g}})=>{
    try {
      document.getElementById('lat').value=t.toFixed(7); document.getElementById('lng').value=g.toFixed(7);
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${t}&lon=${g}`);
      const name=(await r.json()).display_name||'';
      document.getElementById('addr').value=name;
      const textEl=document.getElementById('addr-text');
      if(textEl) textEl.textContent=name;
    } catch (e) {
      if (typeof showFlash === 'function') {
        showFlash('Location resolution services are unavailable.', 'error');
      }
    }
  });

  // --- 1. Dynamic UI ---
  function addCard() {
    const tpl = document.getElementById('card-tpl').content.cloneNode(true);
    document.getElementById('cards').appendChild(tpl);
  }

  // --- 2. Donor Search (Admin Only) ---
  function toggleDnrDropdown(trigger) {
    const wrap = trigger.closest('.ss-wrap');
    const list = wrap.querySelector('.ss-list');
    const isOpen = !list.classList.contains('hidden');
    document.querySelectorAll('.ss-list').forEach(l => l.classList.add('hidden'));
    document.querySelectorAll('.ss-wrap').forEach(w => w.classList.remove('open'));
    if (!isOpen) {
      list.classList.remove('hidden');
      wrap.classList.add('open');
      document.getElementById('dnr-search').value = '';
      document.getElementById('dnr-search').focus();
      document.getElementById('dnr-items').innerHTML = '';
    }
  }

  let dnrTmr;
  async function fetchDonors(q) {
    const items = document.getElementById('dnr-items');
    const list = document.getElementById('dnr-ac');
    if (!q) { items.innerHTML = ''; list.classList.add('hidden'); return; }
    clearTimeout(dnrTmr);
    dnrTmr = setTimeout(async () => {
      try {
        const res = await fetch(`{% url "donor_search_proxy" %}?search=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const users = await res.json();
        
        items.innerHTML = '';
        
        if (!users.length) {
          const d = document.createElement('div');
          d.className = 'mat-item';
          d.textContent = 'No donors found';
          items.appendChild(d);
          list.classList.remove('hidden');
          return;
        }
        
        for (const u of users) {
          const div = document.createElement('div');
          div.className = 'mat-item';
          const b = document.createElement('b');
          b.textContent = u.email;
          div.appendChild(b);
          div.appendChild(document.createTextNode(`${u.first_name} ${u.last_name}`));
          div.addEventListener('mousedown', e => { e.preventDefault(); slDnr(u.user_id, `${u.first_name} ${u.last_name} (${u.email})`); });
          items.appendChild(div);
        }
        
        list.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        showFlash("Donation records could not be retrieved.", "error");
      }
    }, 300);
  }

  function slDnr(id, txt) {
    document.getElementById('dnr-id').value = id;
    document.getElementById('dnr-text').textContent = txt;
    document.getElementById('dnr-ac').classList.add('hidden');
    document.getElementById('dnr-trigger').closest('.ss-wrap').classList.remove('open');
  }

  // --- 3. Form Submission ---
  function prepareSubmit(e) {
    var invalidCustom = false;
    document.querySelectorAll('#cards .restored-card').forEach(function (card) {
      const editor = card.querySelector('.fiber-editor');
      if (editor && !editor.classList.contains('hidden')) {
        const totalEl = editor.querySelector('.fiber-total');
        if (!totalEl.classList.contains('ok')) {
          showFlash('All custom fiber compositions must sum to 100%.', 'error');
          invalidCustom = true;
        }
      }
    });
    if (invalidCustom) {
      if (e && e.preventDefault) e.preventDefault();
      return false;
    }

    if (!document.getElementById('dnr-id').value) {
      showFlash('Please select a donor.', 'error');
      e.preventDefault();
      return false;
    }
    const items = [];
    document.querySelectorAll('#cards .restored-card').forEach(card => {
      const brand = card.querySelector('.brand-sel').value;
      const type = card.querySelector('.type-sel').value;
      if (!brand || !type) { return; }
      const fiberCompRaw = card.querySelector('.fiber-composition')?.value;
      const fiberComp = fiberCompRaw ? JSON.parse(fiberCompRaw) : null;
      const item = {
        weight_kg: Number(card.querySelector('.weight-in').value),
        condition_rating: card.querySelector('.cond-sel').value
      };
      if (fiberComp) {
        item.brand = brand;
        item.clothing_type = type;
        item.fiber_composition = fiberComp;
      } else {
        const lookupVal = Number(card.querySelector('.lookup-id').value);
        if (lookupVal) { item.lookup = lookupVal; }
        else { item.brand = brand; item.clothing_type = type; }
      }
      items.push(item);
    });
    if (items.length === 0) {
      showFlash('At least one item is required.', 'error');
      e.preventDefault();
      return false;
    }
    document.getElementById('items-json').value = JSON.stringify(items);
    return true;
  }

  document.getElementById('add-frm').onsubmit = async (e) => {
    e.preventDefault();
    if (!prepareSubmit(e)) return;
    
    const btn = e.target.querySelector('.btn-submit');
    const oldText = btn.innerText;
    btn.innerText = 'Submitting...';
    btn.disabled = true;

    try {
      const fd = new FormData(e.target);
      const res = await fetch(window.location.pathname, {
        method: 'POST',
        body: fd,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = data.redirect;
      } else {
        if (data.errors && Array.isArray(data.errors)) {
          data.errors.forEach(err => showFlash(err, 'error'));
        } else {
          showFlash(data.error || 'Validation failed. Please check your inputs.', 'error');
        }
      }
    } catch (err) {
      showFlash('System error: ' + err.message, 'error');
    } finally {
      btn.innerText = oldText;
      btn.disabled = false;
    }
  };

  const ALLOWED_EXTS = ['.jpg', '.jpeg', '.png'];
  const MAX_FILE_SIZE = 5 * 1024 * 1024;

  function clearFileInput() {
    const inp = document.getElementById('img-in');
    inp.value = '';
    document.getElementById('img-wrap').style.display = 'none';
    document.getElementById('img-ph').style.display = '';
  }

  function previewImg(inp) {
    const f = inp.files[0];
    if (f) {
      const ext = f.name.substring(f.name.lastIndexOf('.')).toLowerCase();
      if (!ALLOWED_EXTS.includes(ext)) {
        showFlash('Please upload a JPG or PNG image.', 'error');
        inp.value = '';
        return;
      }
      if (f.size > MAX_FILE_SIZE) {
        showFlash('Image must be under 5 MB.', 'error');
        inp.value = '';
        return;
      }
      document.getElementById('img-prv').src = URL.createObjectURL(f);
      document.getElementById('img-wrap').style.display = '';
      document.getElementById('img-ph').style.display = 'none';
    }
  }

  // Start with one card
  addCard();
</script>

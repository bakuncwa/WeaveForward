{% extends 'frontend/base.html' %}
{% load static %}

{% block content %}
<!--
  WeaveForward Admin Add Donation - SSR Refactor
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Lato:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{% static 'frontend/js/location-picker.js' %}"></script>

  <link rel="stylesheet" href="{% static 'frontend/css/donation-form.css' %}">
  <style>
  .btn-add, .btn-submit { width: 100%; padding: 12px; cursor: pointer; font-family: 'Poppins', sans-serif; border: none; font-size: 16px; outline: none; }
  .btn-add { 
    width: 95%; display: block; margin: 0 auto 20px;
    background: var(--gold); color: var(--btn-text); 
    border: 2px dashed var(--dashed-stroke); border-radius: 8px; height: 48px; 
  }
  .btn-submit { background: var(--gold); color: var(--btn-text); border-radius: 30px; margin-top: 14px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15); }
  .trash { background: none; border: none; color: var(--gold); cursor: pointer; }

  .ss-wrap { position: relative; }
  .ss-list, .ac-list { position: absolute; z-index: 100; top: 100%; left: 0; width: 100%; max-height: 200px; overflow-y: auto; background: #fff; border: 1.5px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .ss-item, .ac-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f5f5f5; color: #666666; font-family: 'Poppins', sans-serif; }
  .ss-item:hover, .ac-item:hover { } /* Hover disabled */
  .ss-item b { display: block; color: var(--gold); font-size: 11px; }

  #picker-map { width: 100%; height: 350px; }
  .pin { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gold); cursor: pointer; }
  .pin-wrap { position: relative; }
  .pin-wrap .restored-in { padding-right: 42px; }

  .modal { position: fixed; inset: 0; background: transparent; display: flex; align-items: center; justify-content: center; z-index: 999; }
  .modal-box { background: #fff; border-radius: 16px; overflow: hidden; width: min(640px, 95vw); box-shadow: 0 20px 60px rgba(0,0,0,0.22); }
  .map-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px; background: #fff; }
  .map-title { display: flex; align-items: center; gap: 10px; font-size: 20px; color: var(--gold); font-weight: 400; }
  .map-title-text { color: #000; font-family: 'Poppins', sans-serif; font-weight: 400; }
  .map-caption { margin-top: 4px; font-size: 12px; color: #666666; font-family: 'Poppins', sans-serif; font-weight: 400; }
  .map-close { border: none; background: none; color: #333; cursor: pointer; padding: 4px; }
  .map-actions { display: flex; justify-content: center; padding: 20px; background: #fff; }
  .map-confirm { width: min(220px, 100%); margin: 0; font-family: 'Poppins', sans-serif; font-weight: 300; font-size: 14px; }

  .drop { border: 2px dashed #e8a020; border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer; position: relative; }
  .drop-icon { width: 56px; height: 56px; margin: 0 auto 16px; display: block; }

  .wf-alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
</style>

<div class="wf-content-inner">
  <div id="flash-msgs"></div>
  
  <form id="add-frm" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="items" id="items-json">

    <div class="restored-layout">
      <!-- Left: Items -->
      <div class="restored-left">
        <div id="cards">
          <!-- Cards added via JS -->
        </div>
        <button type="button" class="btn-add" onclick="addCard()">+ Add Another Clothing Group</button>
      </div>

      <!-- Right: Global Info -->
      <div class="restored-right">
        <div class="restored-panel">
          <div class="restored-group" style="margin-bottom:18px">
            <label class="sub-title">Donor</label>
            <div class="ss-wrap">
              <input type="text" class="restored-in restored-in-lg" id="dnr-in" placeholder="Search donor" 
                autocomplete="off" oninput="fetchDonors(this.value)" 
                onfocus="if(this.value) document.getElementById('dnr-ac').classList.remove('hidden')"
                onblur="setTimeout(()=>document.getElementById('dnr-ac').classList.add('hidden'),200)" required>
              <input type="hidden" name="donor_user_id" id="dnr-id" required>
              <div id="dnr-ac" class="ss-list hidden"></div>
            </div>
          </div>

          <div class="restored-group" style="margin-bottom:18px">
            <label class="sub-title">Preferred Pick-Up Date</label>
            <input class="restored-in restored-in-lg" type="date" name="preferred_pickup_date" required>
          </div>
          <div class="restored-row" style="gap:10px; margin-bottom:18px">
            <div class="restored-group">
              <label class="up-label">From</label>
              <input class="restored-in" type="time" name="preferred_pickup_window_start" required>
            </div>
            <div class="restored-group">
              <label class="up-label">To</label>
              <input class="restored-in" type="time" name="preferred_pickup_window_end" required>
            </div>
          </div>
          <div class="restored-group">
            <label class="sub-title">Pick-Up Location</label>
            <div class="pin-wrap">
              <input id="addr" class="restored-in restored-in-lg" name="pickup_display_address" placeholder="Address..." oninput="srchAddr(this.value)" onblur="setTimeout(()=>document.getElementById('ac').classList.add('hidden'),200)" required>
              <button type="button" class="pin" onclick="openMap()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </button>
              <div id="ac" class="ac-list hidden"></div>
              <input type="hidden" id="lat" name="pickup_latitude">
              <input type="hidden" id="lng" name="pickup_longitude">
            </div>
          </div>
          <button type="submit" class="btn-submit">Submit Donation</button>
        </div>

        <div class="restored-panel">
          <div class="upload-header" style="margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: 700; color: #000; font-family: 'Inter', sans-serif;">Donation Upload</div>
            <div style="font-size: 14px; color: #666666; font-family: 'Poppins', sans-serif;">Add the image of your donation here</div>
          </div>
          <div class="drop" onclick="document.getElementById('img-in').click()">
            <div id="img-ph">
              <svg class="drop-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M54 18H34.8L28.8 12H10C7.8 12 6.02 13.8 6.02 16L6 48C6 50.2 7.8 52 10 52H54C56.2 52 58 50.2 58 48V22C58 19.8 56.2 18 54 18Z" fill="#FBBF24"/>
                <circle cx="32" cy="36" r="8" fill="white" fill-opacity="0.2"/>
                <path d="M32 30L32 42M32 30L28 34M32 30L36 34" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <img id="img-prv" src="" style="max-width:100%; border-radius:8px; display:none">
            <input id="img-in" name="donation_image" type="file" accept=".jpg,.jpeg,.png" class="hidden" onchange="previewImg(this)">
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

<template id="card-tpl">
  <div class="restored-card">
    <div class="restored-head">
      <div class="card-title-wrap">
        <div class="card-num"></div>
        <h2 class="card-title"></h2>
      </div>
      <button type="button" class="trash" onclick="this.closest('.restored-card').remove()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m4 5v6m4-6v6M9 6V4h6v2"/></svg>
      </button>
    </div>
    <div class="card-body">
      <div class="restored-row">
        <div class="restored-group">
          <label class="up-label">Clothing*</label>
          <select class="restored-sel type-sel" onchange="loadMaterials(this)">
            <option value="">Choose...</option>
            {% for t in clothing_types %}<option value="{{ t }}">{{ t|capfirst }}</option>{% endfor %}
          </select>
        </div>
        <div class="restored-group"><label class="up-label">Estimated Weight (kg)</label><input type="number" step="0.1" min="0.1" max="254" class="restored-in weight-in" required></div>
      </div>
      <div class="restored-group" style="margin-bottom:14px">
        <label class="up-label">Condition</label>
        <select class="restored-sel cond-sel" required>
          {% for val, text in condition_choices %}<option value="{{ val }}">{{ text }}</option>{% endfor %}
        </select>
      </div>
      <div class="restored-row" style="margin-bottom:0">
        <div class="restored-group">
          <label class="up-label">Brand</label>
          <select class="restored-sel brand-sel" onchange="loadMaterials(this)">
            <option value="">Select...</option>
            {% for b in all_brands %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
          </select>
        </div>
        <div class="restored-group">
          <label class="up-label">Material</label>
          <div class="ss-wrap">
            <input type="text" class="restored-in mat-in" placeholder="Please select a brand and clothing type" disabled oninput="searchMaterials(this)" required>
            <input type="hidden" class="lookup-id">
            <div class="ss-list hidden"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Map Modal -->
<div id="map-modal" class="modal hidden">
  <div class="modal-box">
    <div class="map-head">
      <div class="map-head-left">
        <div class="map-title">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></svg>
          <span class="map-title-text">Pick on Map</span>
        </div>
        <div class="map-caption">Click anywhere or drag the marker to set your pickup location.</div>
      </div>
      <button type="button" class="map-close" onclick="closeMap()" aria-label="Close map">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" /></svg>
      </button>
    </div>
    <div id="picker-map"></div>
    <div class="map-actions">
      <button type="button" class="btn-submit map-confirm" onclick="confirmMap()">Confirm Location</button>
    </div>
  </div>
</div>

<script>
  // --- Auto-Location ---
  navigator.geolocation.getCurrentPosition(async({coords:{latitude:t,longitude:g}})=>{
    try {
      document.getElementById('lat').value=t.toFixed(7); document.getElementById('lng').value=g.toFixed(7);
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${t}&lon=${g}`);
      document.getElementById('addr').value=(await r.json()).display_name||'';
    } catch (e) {
      if (typeof showFlash === 'function') {
        showFlash('Location resolution services are unavailable.', 'error');
      }
    }
  });

  // -------------------------
  // --- Notification System ---
  function showFlash(msg, type = 'info') {
    const container = document.getElementById('flash-msgs');
    if (!container) return;
    const alert = document.createElement('div');
    alert.className = `wf-alert ${type}`;
    alert.style.display = 'flex';
    alert.style.justifyContent = 'space-between';
    alert.style.alignItems = 'center';
    const span = document.createElement('span');
    span.textContent = msg;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.style.cssText = 'background:none;border:none;color:inherit;font-size:18px;cursor:pointer;line-height:1;margin-left:10px;';
    btn.addEventListener('click', () => alert.remove());
    alert.append(span, btn);
    container.prepend(alert);
    setTimeout(() => {
      if (alert.parentElement) {
        alert.style.opacity = '0';
        setTimeout(() => alert.remove(), 400);
      }
    }, 5000);
  }

  // --- 1. Dynamic UI ---
  function addCard() {
    const tpl = document.getElementById('card-tpl').content.cloneNode(true);
    document.getElementById('cards').appendChild(tpl);
  }

  // --- 2. Material Search ---
  async function loadMaterials(el) {
    const card = el.closest('.restored-card');
    const typeSel = card.querySelector('.type-sel');
    const brandSel = card.querySelector('.brand-sel');
    const type = typeSel.value;
    const brand = brandSel.value;
    const mIn = card.querySelector('.mat-in');
    const list = card.querySelector('.ss-list');

    mIn.value = '';
    card.querySelector('.lookup-id').value = '';
    
    if (!type || !brand) {
      mIn.disabled = true;
      mIn.placeholder = 'Please select a brand and clothing type';
      list.innerHTML = '';
      return;
    }
    
    typeSel.disabled = true;
    brandSel.disabled = true;
    try {
      const res = await fetch(`{% url "material_search_proxy" %}?clothing_type=${type}&brand=${brand}`);
      if (!res.ok) throw new Error("HTTP error " + res.status);
      const materials = await res.json();
      
      mIn.disabled = !materials.length;
      mIn.placeholder = materials.length ? 'Search...' : 'No combinations found';
      list.innerHTML = '';
      for (const m of materials) {
        const productName = m.product_name || '';
        const div = document.createElement('div');
        div.className = 'ss-item';
        const b = document.createElement('b');
        b.textContent = productName;
        div.append(b, document.createTextNode(m.fiber_json));
        div.dataset.lookupId = m.lookup_id;
        div.dataset.display = `${m.fiber_json} - ${productName}`;
        div.addEventListener('click', function () {
          selectMat(this, this.dataset.lookupId, this.dataset.display);
        });
        list.appendChild(div);
      }
    } catch (e) {
      console.error(e);
      showFlash("Donation records could not be retrieved.", "error");
    } finally {
      typeSel.disabled = false;
      brandSel.disabled = false;
    }
  }

  function searchMaterials(inp) {
    const list = inp.closest('.ss-wrap').querySelector('.ss-list');
    list.classList.remove('hidden');
    const items = list.querySelectorAll('.ss-item');
    items.forEach(it => it.style.display = it.textContent.toLowerCase().includes(inp.value.toLowerCase()) ? '' : 'none');
    inp.closest('.ss-wrap').querySelector('.lookup-id').value = ''; 
  }

  function selectMat(el, id, text) {
    const wrap = el.closest('.ss-wrap');
    wrap.querySelector('.mat-in').value = text;
    wrap.querySelector('.lookup-id').value = id;
    wrap.querySelector('.ss-list').classList.add('hidden');
  }

  // --- 3. Donor Search (Admin Only) ---
  let dnrTmr;
  async function fetchDonors(q, p = 1) {
    const list = document.getElementById('dnr-ac');
    if (!q) return list.classList.add('hidden');
    clearTimeout(dnrTmr);
    dnrTmr = setTimeout(async () => {
      try {
        const res = await fetch(`{% url "donor_search_proxy" %}?search=${encodeURIComponent(q)}&page=${p}&role=Donor`);
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const data = await res.json();
        const users = data.results || data; 
        
        list.innerHTML = '';
        
        if (!users.length && !data.previous && !data.next) {
          const d = document.createElement('div');
          d.className = 'ss-item';
          d.textContent = 'No donors found';
          list.appendChild(d);
          list.classList.remove('hidden');
          return;
        }
        
        if (data.previous) {
          const prev = document.createElement('div');
          prev.className = 'ss-item';
          prev.style.textAlign = 'center';
          const pb = document.createElement('b');
          pb.textContent = '❮ PREV';
          prev.appendChild(pb);
          prev.addEventListener('mousedown', () => fetchDonors(q, p - 1));
          list.appendChild(prev);
        }
        
        for (const u of users) {
          const div = document.createElement('div');
          div.className = 'ss-item';
          const b = document.createElement('b');
          b.textContent = u.email;
          div.appendChild(b);
          div.appendChild(document.createTextNode(`${u.first_name} ${u.last_name}`));
          div.addEventListener('mousedown', () => slDnr(u.user_id, `${u.first_name} ${u.last_name} (${u.email})`));
          list.appendChild(div);
        }
        
        if (data.next) {
          const next = document.createElement('div');
          next.className = 'ss-item';
          next.style.textAlign = 'center';
          const nb = document.createElement('b');
          nb.textContent = 'NEXT ❯';
          next.appendChild(nb);
          next.addEventListener('mousedown', () => fetchDonors(q, p + 1));
          list.appendChild(next);
        }
        
        list.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        showFlash("Donation records could not be retrieved.", "error");
      }
    }, 300);
  }

  function slDnr(id, txt) {
    document.getElementById('dnr-id').value = id;
    document.getElementById('dnr-in').value = txt;
    document.getElementById('dnr-ac').classList.add('hidden');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('.ss-wrap')) document.querySelectorAll('.ss-list').forEach(l => l.classList.add('hidden'));
  });

  // --- 5. Form Submission ---
  function prepareSubmit(e) {
    const items = [];
    let isValid = true;
    document.querySelectorAll('#cards .restored-card').forEach(card => {
      const lid = card.querySelector('.lookup-id').value;
      if (!lid) { 
        if (isValid) {
          showFlash('Please select a material for all items.', 'error'); 
        }
        isValid = false;
        return; 
      }
      items.push({
        lookup_id: Number(lid),
        weight_kg: Number(card.querySelector('.weight-in').value),
        condition_rating: card.querySelector('.cond-sel').value
      });
    });
    if (!isValid) {
      e.preventDefault();
      return false;
    }
    document.getElementById('items-json').value = JSON.stringify(items);
    return true;
  }

  document.getElementById('add-frm').onsubmit = async (e) => {
    e.preventDefault();
    if (!prepareSubmit(e)) return;
    
    const btn = e.target.querySelector('.btn-submit');
    const oldText = btn.innerText;
    btn.innerText = 'Submitting...';
    btn.disabled = true;

    try {
      const fd = new FormData(e.target);
      const res = await fetch(window.location.pathname, {
        method: 'POST',
        body: fd,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = data.redirect;
      } else {
        if (data.errors && Array.isArray(data.errors)) {
          data.errors.forEach(err => showFlash(err, 'error'));
        } else {
          showFlash(data.error || 'Validation failed. Please check your inputs.', 'error');
        }
      }
    } catch (err) {
      showFlash('System error: ' + err.message, 'error');
    } finally {
      btn.innerText = oldText;
      btn.disabled = false;
    }
  };

  function previewImg(inp) {
    const f = inp.files[0];
    if (f) {
      document.getElementById('img-prv').src = URL.createObjectURL(f);
      document.getElementById('img-prv').style.display = 'block';
      document.getElementById('img-ph').style.display = 'none';
    }
  }

  // Start with one card
  addCard();
</script>
<script src="{% static 'frontend/js/custom-select.js' %}"></script>
<script src="{% static 'frontend/js/donation-form.js' %}"></script>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WeaveForward - Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--b:#3C6591;--bd:#2d5478}
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background: url('{% static "frontend/role_select_background.png" %}') center/cover no-repeat;}

.card{background:#fff;border-radius:16px;padding:40px 40px 44px;width:420px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.18);position:relative}

.icon{width:68px;height:68px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.icon svg{fill:#E6DBC7}

.title{font-family:'Pixelify Sans',monospace;font-size:34px;font-weight:500;color:var(--b);text-align:center;margin-bottom:28px}

.group{margin-bottom:18px}
.lbl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.lbl{font-size:13px;color:#444;font-weight:400}

.in{width:100%;border:0.5px solid #000;border-radius:8px;padding:11px 14px;font-size:14px;outline:none;transition:.15s;color:#3C6591}
.in:focus{border-color:var(--b)}
.in::placeholder{color:#bbb}

.btn{width:100%;background:var(--b);color:#E6DBC7;border-radius:30px;padding:14px;border:none;font-size:15px;font-weight:500;cursor:pointer;transition:.15s;margin-top:10px}
.btn:hover{background:var(--bd)}

.alert {padding:10px; border-radius:8px; font-size:13px; margin-bottom:20px; text-align:center;}
.alert-error {background:#fee2e2; border:1px solid #ef4444; color:#991b1b;}
</style>
</head>
<body>
<div class="card">
    <div class="icon">
        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
    </div>
    <div class="title">Reset Password</div>
    
    {% if error %}
    <div class="alert alert-error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'reset_password_confirm' %}">
        {% csrf_token %}
        <input type="hidden" name="uidb64" value="{{ uidb64 }}">
        <input type="hidden" name="token" value="{{ token }}">

        <div class="group">
            <div class="lbl-row"><label class="lbl" for="pw">New Password</label></div>
            <input class="in" type="password" id="pw" name="new_password" required>
        </div>

        <div class="group">
            <div class="lbl-row"><label class="lbl" for="cpw">Confirm New Password</label></div>
            <input class="in" type="password" id="cpw" name="confirm_password" required>
            <p style="font-size: 11px; color: #666; margin-top: 8px;">Minimum 8 characters, must include letters and numbers.</p>
        </div>

        <button class="btn" type="submit">Reset Password</button>
    </form>
</div>
</body>
</html>

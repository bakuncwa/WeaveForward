{% extends 'frontend/base.html' %}

{% block content %}
<style>
  :root {
    --gold: #e8a020;
    --gold-dark: #c8881a;
    --bg: #f5f4f0;
    --text: #222222;
    --muted: #888888;
    --green: #4a7c59;
  }

  .page-center {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 0 40px;
  }

  .prem-card {
    background: #fff;
    border-radius: 18px;
    padding: 36px 32px;
    width: 460px;
    max-width: 100%;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .07);
    text-align: center;
  }

  .status-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #fff8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: var(--gold-dark);
  }

  .status-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #1a1a1a;
    margin-bottom: 12px;
  }

  .status-text {
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .btn-action {
    display: block;
    width: 100%;
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 14px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    text-decoration: none;
    margin-bottom: 12px;
  }

  .btn-action:hover {
    background: var(--gold-dark);
  }

  .btn-secondary {
    background: #f5f4f0;
    color: #444;
  }

  .btn-secondary:hover {
    background: #ebeae6;
  }

  @media (max-width: 480px), (max-aspect-ratio: 1/1) {
    .prem-card {
      padding: 28px 20px;
      border-radius: 14px;
    }
    .status-title {
      font-size: 19px;
    }
  }
</style>

<div class="page-center">
  <div class="prem-card">
    <div class="status-icon">
      <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 6v6l4 2" />
      </svg>
    </div>
    <h1 class="status-title">Payment Processing</h1>
    <p class="status-text">
      Your card has been verified successfully with a PHP 10.00 verification hold (automatically voided). However, the actual subscription payment is still being processed.
    </p>

  </div>
</div>

<script>
  (function () {
    var statusUrl = "{% url 'tuab_subscription_status' %}";
    var successUrl = "{% url 'tuab_subscribe' %}";
    var pollCount = 0;
    var maxPolls = 10;
    var finished = false;

    function stopWaiting() {
      if (finished) return;
      finished = true;
      window.location.href = "/tuab/subscribe/?status=failed";
    }

    function checkStatus() {
      if (finished) return;
      pollCount += 1;
      fetch(statusUrl, {
        headers: { "Accept": "application/json" },
        credentials: "same-origin"
      })
        .then(function (response) {
          if (!response.ok) throw new Error("status-check-failed");
          return response.json();
        })
        .then(function (data) {
          if (data.has_billing) {
            finished = true;
            window.location.href = successUrl;
            return;
          }
          if (pollCount >= maxPolls) {
            stopWaiting();
          }
        })
        .catch(function () {
          if (pollCount >= maxPolls) {
            stopWaiting();
          }
        });
    }

    setTimeout(checkStatus, 1000);
    setInterval(checkStatus, 1000);
  })();
</script>
{% endblock %}

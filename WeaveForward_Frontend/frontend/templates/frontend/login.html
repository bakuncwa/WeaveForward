{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>WeaveForward - Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&family=Poppins:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --b: #3C6591;
            --bd: #2d5478
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Poppins, sans-serif
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('{% static "frontend/role_select_background.png" %}') center/cover no-repeat;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 40px 44px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .18);
            position: relative
        }

        .icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--b);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px
        }

        .icon svg {
            fill: #E6DBC7
        }

        .title {
            font-family: 'Pixelify Sans', monospace;
            font-size: 34px;
            font-weight: 500;
            color: var(--b);
            text-align: center;
            margin-bottom: 28px
        }

        .group {
            margin-bottom: 18px
        }

        .lbl-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px
        }

        .lbl {
            font-size: 13px;
            color: #444;
            font-weight: 400
        }

        .toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: var(--b);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0
        }

        .in {
            width: 100%;
            border: 0.5px solid #000;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 14px;
            outline: none;
            transition: .15s;
            color: #3C6591
        }

        .in:focus {
            border-color: var(--b)
        }

        .in::placeholder {
            color: #bbb
        }

        .links {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            margin-bottom: 22px
        }

        .links a {
            color: #555;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer
        }

        .links a:hover {
            text-decoration: underline
        }

        .btn {
            width: 100%;
            background: var(--b);
            color: #E6DBC7;
            border-radius: 30px;
            padding: 14px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: .15s
        }

        .btn:hover {
            background: var(--bd)
        }

        .btn[disabled] {
            opacity: .7;
            cursor: wait
        }

        .helper {
            font-size: 11px;
            color: #666;
            margin-top: 8px
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">
            <svg width="30" height="30" viewBox="0 0 24 24">
                <circle cx="12" cy="7" r="4" />
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
            </svg>
        </div>
        <div class="title">Login</div>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                {% if messages %}
                {% for message in messages %}
                Swal.fire({
                    text: "{{ message }}",
                    icon: "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}",
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 5000,
                    timerProgressBar: true,
                    background: '#fff',
                    color: '#222',
                    iconColor: "{% if message.tags == 'error' %}#d9534f{% elif message.tags == 'success' %}#4a7c59{% elif message.tags == 'warning' %}#e8a020{% else %}#0b77dc{% endif %}"
                });
                {% endfor %}
                {% endif %}

                {% if error %}
                Swal.fire({
                    text: "{{ error }}",
                    icon: "error",
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 5000,
                    timerProgressBar: true,
                    background: '#fff',
                    color: '#222',
                    iconColor: "#d9534f"
                });
                {% endif %}
            });
        </script>

        <form id="loginForm" method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div id="credentialsStep" {% if show_2fa %}style="display:none"{% endif %}>
                <div class="group">
                <div class="lbl-row"><label class="lbl" for="em">Your email</label></div>
                <input class="in" type="email" id="em" name="email" placeholder="juan.delacruz@gmail.com"
                    value="{{ email|default:'admin@weaveforward.com' }}" required>
                </div>
                <div class="group">
                    <div class="lbl-row">
                        <label class="lbl" for="pw">Your password</label>
                        <button type="button" class="toggle" onclick="togglePw()">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <span id="ptxt">Show</span>
                        </button>
                    </div>
                    <input class="in" type="password" id="pw" name="password" value="{{ password|default:'SecureAdminPassword123' }}" required>
                </div>
            </div>

            <div id="otpStep" {% if not show_2fa %}style="display:none"{% endif %}>
                <input type="hidden" id="otpEmail" value="{{ email }}">
                <input type="hidden" id="otpPassword" value="{{ password }}">

                <div class="group">
                <div class="lbl-row"><label class="lbl" for="otp">2FA Verification Code</label></div>
                <input class="in" type="text" id="otp" name="otp_code" placeholder="000000" maxlength="6"
                    inputmode="numeric" autocomplete="one-time-code" autofocus required>
                <p class="helper">Enter the 6-digit code from your authenticator app.</p>
                </div>
            </div>

            <div class="links">
                <a href="{% url 'forgot_password' %}">Forgot Password</a>
                <a href="{% url 'role_select' %}">Register</a>
            </div>
            <button id="loginSubmit" class="btn" type="submit">{% if show_2fa %}Verify & Log in{% else %}Log in{% endif %}</button>
        </form>
    </div>
    <script>
        function togglePw() {
            const i = document.getElementById('pw'), t = document.getElementById('ptxt');
            const show = i.type === 'password';
            i.type = show ? 'text' : 'password';
            t.textContent = show ? 'Hide' : 'Show';
        }

        function showToast(message, icon = 'error') {
            Swal.fire({
                text: message,
                icon,
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 5000,
                timerProgressBar: true,
                background: '#fff',
                color: '#222',
                iconColor: icon === 'success' ? '#4a7c59' : '#d9534f'
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('loginForm');
            const submitButton = document.getElementById('loginSubmit');
            const credentialsStep = document.getElementById('credentialsStep');
            const otpStep = document.getElementById('otpStep');
            const emailInput = document.getElementById('em');
            const passwordInput = document.getElementById('pw');
            const otpInput = document.getElementById('otp');
            const otpEmail = document.getElementById('otpEmail');
            const otpPassword = document.getElementById('otpPassword');

            function setOtpStepVisible() {
                credentialsStep.style.display = 'none';
                otpStep.style.display = '';
                submitButton.textContent = 'Verify & Log in';
                otpEmail.name = 'email';
                otpPassword.name = 'password';
                emailInput.name = '';
                passwordInput.name = '';
                if (otpInput) {
                    otpInput.required = true;
                    otpInput.focus();
                }
                if (emailInput) {
                    emailInput.required = false;
                }
                if (passwordInput) {
                    passwordInput.required = false;
                }
            }

            function setCredentialsStepVisible() {
                credentialsStep.style.display = '';
                otpStep.style.display = 'none';
                submitButton.textContent = 'Log in';
                otpEmail.name = '';
                otpPassword.name = '';
                emailInput.name = 'email';
                passwordInput.name = 'password';
                if (otpInput) {
                    otpInput.required = false;
                }
                if (emailInput) {
                    emailInput.required = true;
                }
                if (passwordInput) {
                    passwordInput.required = true;
                }
            }

            if (otpStep.style.display !== 'none') {
                setOtpStepVisible();
            } else {
                setCredentialsStepVisible();
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();

                submitButton.disabled = true;

                try {
                    const formData = new FormData(form);
                    const response = await fetch(form.action, {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: new URLSearchParams(formData),
                        credentials: 'same-origin',
                    });

                    const data = await response.json().catch(() => ({}));

                    if (response.ok && data.redirect_url) {
                        window.location.href = data.redirect_url;
                        return;
                    }

                    if (data['2fa_required']) {
                        otpEmail.value = emailInput.value;
                        otpPassword.value = passwordInput.value;
                        if (otpInput) {
                            otpInput.value = '';
                        }
                        setOtpStepVisible();
                        showToast('Enter your 2FA verification code.', 'success');
                        return;
                    }

                    showToast(data.error || 'Login failed. Please try again.');
                } catch (error) {
                    showToast('Backend API is offline or unreachable.');
                } finally {
                    submitButton.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
